services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enotaryhub
      POSTGRES_USER: enotaryhub
      POSTGRES_PASSWORD: enotaryhub
    ports:
      - "5432:5432"
    volumes:
      - enotaryhub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enotaryhub -d enotaryhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enotaryhub_postgres:
